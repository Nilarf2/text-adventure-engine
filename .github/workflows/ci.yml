name: focused-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tools/image/requirements.txt
      - run: npm run typecheck && npm run build
      - run: npm test && npm run check:flow && npm run check:example
      - run: npm run test:tools && npm run example:build
      - run: npm run example:markdown
      - run: node tools/authoring/build-story-map.mjs --story examples/minimal/story.json --out build/story-map
